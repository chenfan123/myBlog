map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

# Docker Compose 服务重建后容器 IP 会变化。通过 Docker 内置 DNS 动态解析，
# 避免 Nginx 长期缓存旧 IP 并返回 502。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream web_upstream {
    zone web_upstream 64k;
    server web:3000 resolve;
}

upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
}

upstream a2ui_server_upstream {
    zone a2ui_server_upstream 64k;
    server a2ui-server:3000 resolve;
}

upstream a2ui_web_upstream {
    zone a2ui_web_upstream 64k;
    server a2ui-web:80 resolve;
}

server {
    listen 80;
    listen [::]:80;
    server_name ainew.gz.cn www.ainew.gz.cn;
    return 301 https://ainew.gz.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ainew.gz.cn www.ainew.gz.cn;

    ssl_certificate /etc/nginx/certs/ainew.gz.cn.pem;
    ssl_certificate_key /etc/nginx/certs/ainew.gz.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 12m;

    location = /_a2ui_auth_check {
        internal;
        proxy_pass http://api_upstream/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @a2ui_login {
        return 302 /login?next=/agent-demo/a2ui;
    }

    # 首页只公开固定个人资料生成接口和静态渲染壳；任意 Playground 生成仍需登录。
    location = /a2ui-api/v1/profile {
        proxy_pass http://a2ui_server_upstream/v1/profile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /a2ui-profile/ {
        proxy_pass http://a2ui_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /a2ui/assets/ {
        proxy_pass http://a2ui_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
    }

    location /a2ui-api/ {
        auth_request /_a2ui_auth_check;
        error_page 401 = @a2ui_login;
        proxy_pass http://a2ui_server_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /a2ui/ {
        auth_request /_a2ui_auth_check;
        error_page 401 = @a2ui_login;
        proxy_pass http://a2ui_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
