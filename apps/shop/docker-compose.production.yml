services:
  shop:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: atelier-market:latest
    container_name: atelier-market
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SHOP_PORT:-4173}:80"
    networks:
      gateway:
        aliases: [atelier-market]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-myblog_backend}
