server {
    listen 80;
    server_name _;

    location /a2ui/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /a2ui/index.html;
    }

    location /a2ui-profile/ {
        root /usr/share/nginx/html;
        try_files /a2ui/index.html =404;
    }

    location /a2ui-api/ {
        proxy_pass http://a2ui-server:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
